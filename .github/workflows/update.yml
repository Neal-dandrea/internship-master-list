name: Update listings

on:
  schedule:
    # Every hour from 8 AM through 1 AM Eastern, which is 18 runs a day. GitHub
    # schedules in UTC and does not follow daylight saving time, so the job is
    # scheduled every hour and the "gate" job below skips 2 AM to 7 AM Eastern.
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          hour=$(TZ=America/New_York date +%H)
          echo "Eastern hour is $hour"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! echo " 02 03 04 05 06 07 " | grep -q " $hour "; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml fastembed
      # The embedding model is a 130 MB download, so it is kept between runs.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: python collect.py
        env:
          # The resume profile is a repository secret. It is never written to
          # the repository. Without it the run still works and adds no scores.
          RESUME_PROFILE: ${{ secrets.RESUME_PROFILE }}
          RESUME_STATEMENTS: ${{ secrets.RESUME_STATEMENTS }}
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      - name: Commit the refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh listings"
            # If someone pushed while this ran, leave it for the next run
            # instead of failing.
            git push || echo "The repository changed during the run. The next run will publish."
          fi
