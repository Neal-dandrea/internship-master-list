name: Survey candidate sites

on:
  schedule:
    - cron: "40 8 * * *"       # once a night, when the hourly job is quiet
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # One seventh of the candidates each night, chosen by the day of the week.
      - run: python survey.py --slice $(( $(date +%u) - 1 )) 7
      - name: Commit any newly found sites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/companies.json
          if git diff --cached --quiet; then
            echo "No new sites."
          else
            git commit -m "Add career sites found by the survey"
            git push || echo "The repository changed during the run. The next run will publish."
          fi
